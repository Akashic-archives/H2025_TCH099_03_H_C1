<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/loginStyle.css">
    <script type="module" src="/Javascript/chessGame.js"></script>
    <title>Liar's Chess</title>
</head>
<body>

    <header>
        <img src="/Assets/Liar's Chess - White logo.png" alt="Liar's Chess logo" id="logo">
    </header>

    <main>

        <h1 id="titreConnection">Connection</h1>

        <div class="center">
            <p id="courriel">Courriel : <input type="email" id="courrielBar" placeholder="example@email.com"></p>
        </div>

        <div class="center">
           <p id="motDePasse">Mot de passe : <input type="password" id="motDePasseBar"></p>
        </div>

        <p id="error"></p>
        
        <button id="bSeConnecter">Se connecter</button>

        <p id="loginToSignup">Première fois ici? Inscrivez-vous <a href="signup.html" id="toSignup">ici</a> !</p>
    
        
    </main>

    <footer>
        <p id="copyright">Liar's Chess &copy2025</p>
    </footer>

</body>
</html>
