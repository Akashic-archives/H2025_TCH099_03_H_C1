<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/signupStyle.css">
    <title>Liar's chess</title>
</head>
<body>
    <header>
        <img src="/Assets/Liar's Chess - White logo.png" alt="Liar's Chess logo" id="logo">
    </header>

    <main>

        <h1 id="titreInscription">Inscription</h1>

        <div class="center">
           <p id="prenom">Prénom : <input type="text" id="prenomBar" ></p> 
        </div>
        
        <div class="center">
            <p id="nom">Nom : <input type="text" id="nomBar"></p>
        </div>
        
        <div class="center">
            <p id="courriel">Courriel : <input type="email" id="courrielBar" placeholder="example@email.com"></p>
        </div>

        <div class="center">
            <p id="motDePasse">Mot de passe : <input type="password" id="motDePasseBar"></p>
        </div>

        <div class="center">
            <p id="confirmation">Confirmez votre mot de passe : <input type="password" id="confirmationBar"></p>
        </div>

        <button id="bInscrire">S'inscrire</button>
         
        <p id="signupToLogin">Déjà inscrit? Connectez-vous <a href="login.html" id="toLogin">ici</a> !</p>
        <p id="guest">Connectez-vous en tant qu'invité <a href="login.html" id="toGuest">ici</a> !</p>
    </main>

    <footer>
        <p>&copy</p>
    </footer>

</body>
</html>
